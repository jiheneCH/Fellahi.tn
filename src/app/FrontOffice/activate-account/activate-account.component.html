<!-- Video Background -->
<video autoplay muted loop playsinline class="video-background">
  <source src="assets/fruitkha-1.0.0/assets/videos/vecteezy_farmer-holding-fresh-vegetables_51295621.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

<!-- Scrollable Container with Smooth Scrolling -->
<div class="scrollable-container">
  <section class="bg-main-light rounded p-4 my-3 w-75 mx-auto">
    <div class="app-brand justify-content-center text-center mb-3">
      <a href="/" class="app-brand-link gap-2 text-decoration-none">
        <img width="500" src="/assets/fruitkha-1.0.0/assets/img/fallahi.png" alt="Company Logo">
      </a>
    </div>

    <h4 class="mb-2 text-center">Activate Your Account👋</h4>
    <p class="mb-4 text-center">Please enter the activation code sent to your email</p>

    <form [formGroup]="activationForm" (ngSubmit)="activateAccount()">
      <!-- Activation Code Field -->
      <div class="mb-2">
        <label for="activationCode">Activation Code:</label>
        <input formControlName="activationCode"
               id="activationCode"
               type="text"
               class="form-control"
               maxlength="6"
               placeholder="Enter 6-digit code">
        <div class="alert alert-danger"
             *ngIf="activationForm.get('activationCode')?.touched && activationForm.get('activationCode')?.errors">
          <p *ngIf="activationForm.get('activationCode')?.errors?.['required']">
            Activation code is required
          </p>
          <p *ngIf="activationForm.get('activationCode')?.errors?.['minlength'] ||
                    activationForm.get('activationCode')?.errors?.['maxlength']">
            Code must be exactly 6 digits
          </p>
          <p *ngIf="activationForm.get('activationCode')?.errors?.['pattern']">
            Only numbers are allowed
          </p>
        </div>
      </div>

      <button class="btn btn-main ms-auto d-block" [disabled]="activationForm.invalid || isActivating">
        <i class="fas fa-spinner fa-spin" *ngIf="isActivating"></i>
        Activate Account
      </button>

      <div *ngIf="activationMessage"
           class="alert mt-3"
           [ngClass]="{
             'alert-success': activationSuccess,
             'alert-danger': !activationSuccess
           }">
        {{ activationMessage }}
      </div>
    </form>
  </section>
</div>
