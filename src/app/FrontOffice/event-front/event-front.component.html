      <div class="latest-events mt-150 mb-150">
        <div class="container">
          <div class="row">
            <div class="col-lg-4 col-md-6" *ngFor="let event of availableEvents">
              <div class="single-latest-event">
                <a href="#">
                  <div 
                    class="latest-event-bg" 
                    [ngStyle]="{ 'background-image': 'url(http://localhost:8080/piEvent/uploads/' + event.image + ')' }">
                  </div>
                </a>
                <div class="event-text-box">
                  <h3><a href="#">{{ event.title }}</a></h3>
                  <p class="blog-meta">
                    <span class="author"><i class="fas fa-user"></i> Admin</span>
                    <span class="date"><i class="fas fa-calendar"></i> {{ event.dateEvent }}</span>
                  </p>
                  <p class="excerpt">
                    {{ event.description}}
                  </p>
                  <a [routerLink]="['/event-details', event.idEvent]" class="read-more-btn">
                    read more <i class="fas fa-angle-right"></i>
                  </a>
                  
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      
  
      <div class="row">
        <div class="col-lg-12 text-center">
          <div class="pagination-wrap">
            <ul>
              <li><a href="#">Prev</a></li>
              <li><a href="#">1</a></li>
              <li><a class="active" href="#">2</a></li>
              <li><a href="#">3</a></li>
              <li><a href="#">Next</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
