<div style="position: relative; height: 100vh; width: 100vw; overflow: hidden;">

  <!-- Video Background -->
  <video autoplay muted loop playsinline
         style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
    <source src="assets/fruitkha-1.0.0/assets/videos/vecteezy_farmer-holding-fresh-vegetables_51295621.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Forgot Password Form Section -->
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <section class="p-4 w-100 position-relative z-1"
             style="max-width: 400px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px); border-radius: 10px;">
      
      <!-- Logo -->
      <div class="app-brand justify-content-center text-center mb-3">
        <img width="350" src="/assets/fruitkha-1.0.0/assets/img/fallahi.png" alt="Fellahi Logo">
      </div>

      <h4 class="mb-2 text-center text-dark">Password Recovery</h4>
      <p class="mb-4 text-center text-dark">Enter your email to reset password</p>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="alert alert-success mb-3">
        {{ successMessage }}
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-danger mb-3">
        {{ errorMessage }}
      </div>

      <form [formGroup]="forgotForm" (ngSubmit)="submit()">
        <div class="mb-3">
          <input type="email"
                 formControlName="email"
                 class="form-control"
                 placeholder="Enter your email"
                 [ngClass]="{ 'is-invalid': forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched }"
                 style="font-size: 14px; padding: 10px; color: black; background-color: rgba(255, 255, 255, 0.6);">
          <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched" class="invalid-feedback d-block">
            Valid email is required
          </div>
        </div>

        <button class="btn btn-primary w-100" [disabled]="forgotForm.invalid || isLoading">
          <span *ngIf="!isLoading">Send Reset Instructions</span>
          <span *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Processing...
          </span>
        </button>

        <div class="text-center mt-3">
          <a routerLink="/login" class="text-muted text-decoration-none" style="font-size: 14px;">Back to Login</a>
        </div>
      </form>
    </section>
  </div>
</div>
