<div class="container payment-container">
  <h2 class="payment-title">
    <i class="fas fa-shopping-basket"></i> Checkout Payment
  </h2>

  <form (ngSubmit)="payerEnLigne()" #paymentForm="ngForm">

    <!-- Customer Information -->
    <div class="form-group">
      <label for="name">
        <i class="fas fa-user"></i> Full Name
      </label>
      <input type="text" id="name" name="name" [(ngModel)]="client.name" class="form-control" required readonly>
    </div>

    <div class="form-group">
      <label for="email">
        <i class="fas fa-envelope"></i> Email Address
      </label>
      <input type="email" id="email" name="email" [(ngModel)]="client.email" class="form-control" required readonly>
    </div>

    <div class="form-group">
      <label for="address">
        <i class="fas fa-map-marker-alt"></i> Delivery Address
      </label>
      <input type="text" id="address" name="address" [(ngModel)]="client.address" class="form-control" required readonly>
    </div>

    <div class="form-group">
      <label for="phone">
        <i class="fas fa-phone"></i> Phone Number
      </label>
      <input type="text" id="phone" name="phone" [(ngModel)]="client.phone" class="form-control" required readonly>
    </div>

    <!-- Order Information -->
    <div class="form-group">
      <label for="montant">
        <i class="fas fa-apple-alt"></i> Order Total
      </label>
      <input type="number" id="montant" name="montant" [(ngModel)]="montant" class="form-control" required readonly>
    </div>

    <!-- Payment Information -->
    <div class="form-group">
      <label for="card-element">
        <i class="far fa-credit-card"></i> Card Details
      </label>
      <div id="card-element" class="form-control"></div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn-pay">
      <i class="fas fa-seedling"></i> Confirm Payment
    </button>
  </form>
</div>
