<div style="position: relative; height: 100vh; width: 100vw; overflow: hidden;">

  <!-- Video Background -->
  <video autoplay muted loop playsinline
         style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
    <source src="\assets\fruitkha-1.0.0\assets\videos\vecteezy_female-farmer-working-early-on-farm-holding-wood-basket-of_16030865.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Reclamation Form Section -->
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <section class="p-4 w-100 position-relative z-1 shadow"
             style="max-width: 600px; background: linear-gradient(to right, #e6f5ec, #cdeed3); border-radius: 15px;">
      
    <!-- Return Button -->
<div class="d-flex justify-content-start mb-2">
  <button type="button" class="btn btn-outline-secondary btn-icon-only" (click)="goBack()" aria-label="Return">
    <i class="fas fa-arrow-left"></i>
  </button>
</div>

<!-- Heading -->
<div class="text-center mb-4">
  <h3 class="fw-bold text-success">Submit a Complaint</h3>
  <p class="text-muted">We value your feedback. Please let us know your concerns.</p>
</div>

      <!-- Optional: Show current user role -->
      <div class="text-center mb-3">
        <small class="text-muted fs-6">
          👋 What's On Your Mind , <strong class="text-success text-uppercase">{{ role }}</strong> <br />  <strong class="text-primary">{{ username }}</strong>!  
          
        </small>
      </div>
      
      

<form [formGroup]="reclamationForm" (ngSubmit)="onAddReport()">

  <!-- Subject -->
  <div class="mb-3">
    <label for="subject" class="form-label fw-semibold">Complaint Subject</label>
    <select id="subject" formControlName="subject" class="form-select"
            [class.is-invalid]="reclamationForm.get('subject')?.invalid && reclamationForm.get('subject')?.touched">
      <option [ngValue]="null" disabled>Select a subject</option>
      <option *ngFor="let s of subjects" [value]="s">{{ s }}</option>
    </select>
    <div class="invalid-feedback" *ngIf="reclamationForm.get('subject')?.invalid && reclamationForm.get('subject')?.touched">
      Subject is required.
    </div>
  </div>

  <!-- Description -->
  <div class="mb-3">
    <label for="description" class="form-label fw-semibold">Description</label>
    <textarea id="description" rows="4" formControlName="description"
              class="form-control"
              placeholder="Describe your issue here..."
              [class.is-invalid]="reclamationForm.get('description')?.invalid && reclamationForm.get('description')?.touched"></textarea>
    <div class="invalid-feedback" *ngIf="reclamationForm.get('description')?.invalid && reclamationForm.get('description')?.touched">
      Description is required.
    </div>
  </div>

  <!-- Submit Button -->
  <div class="text-center">
    <button type="submit" class="btn btn-success px-4" [disabled]="isLoading">
      <i *ngIf="isLoading" class="fas fa-spinner fa-spin me-2"></i>
      Submit
    </button>
  </div>

  
  <!-- Messages -->
<div *ngIf="successMessage" class="alert alert-success mt-3 text-center">
  {{ successMessage }}
</div>
<div *ngIf="errorMessage" class="alert alert-danger mt-3 text-center">
  {{ errorMessage }}
</div>

</form>
    </section>
  </div>
</div>
