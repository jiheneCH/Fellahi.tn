<div style="position: relative; height: 100vh; width: 100vw; overflow: hidden;">

  <!-- Video Background -->
  <video autoplay muted loop playsinline
         style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
    <source src="\assets\fruitkha-1.0.0\assets\videos\vecteezy_female-farmer-working-early-on-farm-holding-wood-basket-of_16030865.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Solid Table Section -->
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <section class="p-4 w-100 position-relative z-1 shadow"
             style="max-width: 900px; background: linear-gradient(to right, #e6f5ec, #cdeed3); border-radius: 15px;">
      
      <!-- Header and Add Button -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="text-success m-0 fw-bold">Reports Overview</h4>
        <button class="btn btn-success" (click)="onAddReport()">
          <i class="fas fa-plus me-1"></i> Add Report
        </button>
      </div>

      <!-- Table -->
      <div class="table-responsive">
        <table class="table text-dark align-middle mb-0 custom-report-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Title</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let report of reports; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ report.subject }}</td>
              <td>
                <span class="badge bg-primary">{{ report.status }}</span>
              </td>
              <td>{{ report.createdAt | date:'MMMM d, y, h:mm a' }}
              </td>
              <td>
                <button class="btn btn-sm btn-outline-info me-2">View</button>
              </td>
            </tr>
          </tbody>
          
        </table>
      </div>
    </section>
  </div>
</div>
