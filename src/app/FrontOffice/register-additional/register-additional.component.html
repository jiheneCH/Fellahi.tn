<!-- Second Step Register Page Container with Video Background -->
<div style="position: relative; height: 100vh; width: 100vw; overflow: hidden;">
    <!-- Video Background -->
    <video autoplay muted loop playsinline
           style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
      <source src="/assets/fruitkha-1.0.0/assets/videos/vecteezy_assortment-of-fresh-vegetables-including-tomatoes-peppers_51295631.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  
    <!-- Scrollable Content -->
    <div class="scrollable-wrapper"
     style="height: 100vh; overflow-y: auto; padding-top: 120px; padding-bottom: 40px;">

      <div class="d-flex justify-content-center">
        <section class="bg-main-light rounded p-4 w-100"
                 style="max-width: 400px; backdrop-filter: blur(8px); background-color: rgba(255, 255, 255, 0.5);">
  
          <!-- Logo -->
          <div class="text-center mb-3">
            <a class="text-decoration-none">
              <img width="350" src="/assets/fruitkha-1.0.0/assets/img/fallahi.png" alt="Fellahi Logo">
            </a>
          </div>
  
          <h4 class="mb-2 text-center text-black">Almost done! 📋</h4>
          <p class="mb-4 text-center text-black">Complete your profile to start using Fellahi.tn</p>
  
          <form [formGroup]="stepTwoForm" (ngSubmit)="onSubmit()">
  
            <!-- Profile Picture Upload with Icon -->
            <div class="mb-3 text-center position-relative">
              <label class="form-label text-black d-block">Profile Picture</label>
  
              <label for="profileInput" style="cursor: pointer; position: relative; display: inline-block;">
                <img *ngIf="selectedImageUrl"
                     [src]="selectedImageUrl"
                     class="rounded-circle shadow"
                     style="width: 100px; height: 100px; object-fit: cover; border: 2px solid #ccc;" />
  
                <!-- Default icon if no image selected -->
                <img *ngIf="!selectedImageUrl"
                src="\assets\fruitkha-1.0.0\assets\img\default.jfif"
                class="rounded-circle shadow"
                style="width: 100px; height: 100px; object-fit: cover; border: 2px solid #ccc;" />
  
                <!-- Upload icon overlay -->
                <i class="bi bi-camera-fill position-absolute"
                   style="bottom: 0; right: 0; font-size: 20px; background: white; border-radius: 50%; padding: 4px;"></i>
              </label>
  
              <input id="profileInput" type="file" (change)="onFileSelected($event)" accept="image/*" hidden>
            </div>
  
              
  
            <!-- Address -->
            <div class="mb-3">
              <label for="address" class="form-label text-black">Address</label>
              <input type="text" id="address" formControlName="address" class="form-control"
                     placeholder="Enter your address"
                     style="background-color: rgba(255,255,255,0.5); color: black;">
            </div>
  
            <!-- Governorate -->
            <div class="mb-3">
              <label for="governorate" class="form-label text-black">Governorate</label>
              <select id="governorate" formControlName="governorate" class="form-control"
                      style="background-color: rgba(255,255,255,0.5); color: black;">
                <option value="">Select your governorate</option>
                <option *ngFor="let gov of governorates" [value]="gov">{{ gov }}</option>
              </select>
            </div>

            <!-- Phone Number -->
<div class="mb-3">
  <label for="phone" class="form-label text-black">Phone Number</label>
  <div class="input-group">
    <span class="input-group-text border-end-0"
          style="background-color: #d4edda; color: black; border-top-left-radius: 25px; border-bottom-left-radius: 25px; border-top-right-radius: 0; border-bottom-right-radius: 0;">
      <img src="\assets\fruitkha-1.0.0\assets\img\TN.png" alt="TN" style="width: 20px; height: 14px; margin-right: 5px;">
      +216
    </span>

    <input type="text" id="phone" formControlName="phone"
           class="form-control border-start-0"
           maxlength="8"
           placeholder="Enter 8-digit number"
           style="background-color: rgba(255,255,255,0.5); color: black; border-top-right-radius: 25px; border-bottom-right-radius: 25px;">
  </div>
  <div *ngIf="stepTwoForm.get('phoneNumber')?.invalid && stepTwoForm.get('phoneNumber')?.touched"
       class="text-danger mt-1">
    Phone number must be exactly 8 digits.
  </div>
</div>


   <!-- Error Message -->
   <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>
  
               <!-- Submit Button -->
               <button type="submit" class="btn btn-success w-100" [disabled]="isLoading">
                {{ isLoading ? 'Submitting...' : 'Complete Registration' }}
              </button>
          </form>
        </section>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
