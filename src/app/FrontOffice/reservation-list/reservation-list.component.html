<!-- breadcrumb-section -->
<div class="breadcrumb-section breadcrumb-bg">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 offset-lg-2 text-center">
                <div class="breadcrumb-text">
                    
                    <h1>My Bookings</h1>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- end breadcrumb-section -->

<!-- reservations section -->
<div class="reservation-section mt-150 mb-150">
    <div class="container">
        <!-- Tableau des réservations -->
        <div class="reservation-table-container">
            <table class="reservation-table">
                <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Reservation Date</th>
                        <th>Total Price</th>
                        <th>Number of Pass</th>
                        <th>Event</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody> 
                    <tr *ngFor="let booking of bookings">
                        <td class="reference-cell">
                            <span class="reference-badge">{{ booking.reference }}</span>
                        </td>
                        <td>{{ booking.reservationDate | date: 'mediumDate' }}</td>
                        <td class="price-cell">{{ booking.prixTotal }} DT</td>
                        <td class="passengers-cell">
                            <span class="passengers-badge">{{ booking.numberOfPass }}</span>
                        </td>
                        <td class="event-title">{{ booking.event?.title }}</td>
                        <td class="actions-cell">
                            <div class="action-buttons">
                                                             <!-- Bouton Cancel -->
<button class="btn btn-outline-danger p-2 rounded-md hover:bg-red-50 transition-colors flex items-center justify-center"
[disabled]="booking.event?.archived || booking.event?.status === 'archive'"
(click)="onCancelReservation(booking.idReservation)"
title="{{ (booking.event?.archived || booking.event?.status === 'archive') ? 'Annulation impossible (événement archivé)' : 'Annuler la réservation' }}">
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
<path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
<path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
</svg>
<span class="ml-2 whitespace-nowrap">
{{ (booking.event?.archived || booking.event?.status === 'archive') ? 'Archived' : 'Cancel' }}
</span>
</button>

<!-- Bouton Review -->
<button class="review-btn"
[ngClass]="{ 'archived-btn': !booking.event?.archived }"
[routerLink]="['/review', booking.event?.idEvent, booking.user?.id]"
[disabled]="!booking.event?.archived"
title="{{ booking.event?.archived ? 'Ajouter un avis' : 'Avis uniquement après l’événement' }}">
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
<path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
<path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
</svg>
<span class="ml-2">
{{ booking.event?.archived ? 'Review' : 'Review Archived' }}
</span>
</button>
                                  
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="pagination-wrap">
                    <ul>
                        <li><a href="#">Prev</a></li>
                        <li><a href="#">1</a></li>
                        <li><a class="active" href="#">2</a></li>
                        <li><a href="#">3</a></li>
                        <li><a href="#">Next</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- end reservations section -->

<!-- logo carousel -->
<div class="logo-carousel-section">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="logo-carousel-inner">
                    <div class="single-logo-item">
                        <img src="assets/img/company-logos/1.png" alt="">
                    </div>
                    <div class="single-logo-item">
                        <img src="assets/img/company-logos/2.png" alt="">
                    </div>
                    <div class="single-logo-item">
                        <img src="assets/img/company-logos/3.png" alt="">
                    </div>
                    <div class="single-logo-item">
                        <img src="assets/img/company-logos/4.png" alt="">
                    </div>
                    <div class="single-logo-item">
                        <img src="assets/img/company-logos/5.png" alt="">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
