<div style="position: relative; height: 100vh; width: 100vw; overflow: hidden;">

  <!-- Video Background -->
  <video autoplay muted loop playsinline
         style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
    <source src="assets/fruitkha-1.0.0/assets/videos/vecteezy_farmer-holding-fresh-vegetables_51295621.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Reset Password Form Section -->
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <section class="p-4 w-100 position-relative z-1"
             style="max-width: 400px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px); border-radius: 10px;">
      
      <!-- Logo -->
      <div class="app-brand justify-content-center text-center mb-3">
        <img width="350" src="/assets/fruitkha-1.0.0/assets/img/fallahi.png" alt="Fellahi Logo" class="img-fluid">
      </div>

      <h4 class="mb-2 text-center text-dark">Reset Password</h4>

      <form [formGroup]="resetForm" (ngSubmit)="submit()">
        
        <!-- Password Field -->
        <div class="mb-3 position-relative">
          <input [type]="showPassword ? 'text' : 'password'"
                 formControlName="password"
                 class="form-control pe-5"
                 placeholder="New password"
                 [class.is-invalid]="password.invalid && (password.dirty || password.touched)"
                 aria-label="Password"
                 style="font-size: 14px; padding: 10px; color: black; background-color: rgba(255, 255, 255, 0.6);">
          <i class="fas"
             [class.fa-eye]="!showPassword"
             [class.fa-eye-slash]="showPassword"
             (click)="togglePasswordVisibility()"
             style="position: absolute; top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer;"></i>

          <div *ngIf="password.invalid && (password.dirty || password.touched)" class="invalid-feedback d-block">
            <div *ngIf="password.errors?.['required']">Password is required</div>
            <div *ngIf="password.errors?.['passwordStrength']">
              Password must be at least 6 characters, include an uppercase letter and a number
            </div>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="mb-3 position-relative">
          <input [type]="showConfirmPassword ? 'text' : 'password'"
                 formControlName="confirmPassword"
                 class="form-control pe-5"
                 placeholder="Confirm password"
                 [class.is-invalid]="resetForm.errors?.['passwordMismatch'] && 
                                    (confirmPassword.dirty || confirmPassword.touched)"
                 aria-label="Confirm Password"
                 style="font-size: 14px; padding: 10px; color: black; background-color: rgba(255, 255, 255, 0.6);">

          <div *ngIf="resetForm.errors?.['passwordMismatch'] && 
                     (confirmPassword.dirty || confirmPassword.touched)" class="invalid-feedback d-block">
            Passwords do not match
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="alert alert-danger mb-3">
          {{ errorMessage }}
        </div>

        <!-- Success Message -->
        <div *ngIf="successMessage" class="alert alert-success mb-3">
          {{ successMessage }}
        </div>

        <!-- Submit Button -->
        <button class="btn btn-primary w-100"
                [disabled]="resetForm.invalid || isLoading">
          <span *ngIf="!isLoading">Reset Password</span>
          <span *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Processing...
          </span>
        </button>
      </form>
    </section>
  </div>
</div>
