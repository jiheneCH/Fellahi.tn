<div>
    <div class="panel flex items-center overflow-x-auto whitespace-nowrap p-3 text-primary">
       
        
    </div>

    <div class="panel mt-6 pb-0">
        <div class="mb-5 flex flex-col gap-5 md:flex-row md:items-center">
            <h5 class="text-lg font-semibold dark:text-white-light">Professors</h5>
            <div class="flex w-1/2 items-center justify-center">
                <button type="button" class="btn btn-outline-primary" (click)="assignSupervisor()">
                    
                    Assign Supervisors</button><p id="message"></p>

                    <script>
                      const button = document.getElementById("myButton");
                      const message = document.getElementById("message");
                    
                      button.addEventListener("click", function() {
                        if (confirm("Are you sure you want to perform this action?")) {
                          message.textContent = "Action confirmed!";
                          // Perform the action you want after confirmation
                        } else {
                          message.textContent = "Action cancelled.";
                        }
                      });
                    </script>
                    
            </div>
            <div class="ltr:ml-auto rtl:mr-auto">
                <input [(ngModel)]="search1" type="text" class="form-input w-auto" placeholder="Search..." />
            </div>
        </div>

        <div class="datatable">
            <ng-datatable
                [rows]="rows"
                [columns]="datatable1Cols"
                [sortable]="true"
                sortColumn="firstName"
                
                [search]="search1"
                skin="whitespace-nowrap table-hover"
                firstArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M13 19L7 12L13 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path opacity="0.5" d="M16.9998 19L10.9998 12L16.9998 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg>'
                lastArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M11 19L17 12L11 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path opacity="0.5" d="M6.99976 19L12.9998 12L6.99976 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg> '
                previousArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M15 5L9 12L15 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg>'
                nextArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M9 5L15 12L9 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg>'
            >
                <ng-template slot="firstName" let-value="data">
                    <div class="flex w-max items-center">
                        <img class="h-9 w-9 rounded-full object-cover ltr:mr-2 rtl:ml-2" [src]="'/assets/images/profile-' + value.id + '.jpeg'" />
                        {{ value.firstName + ' ' + value.lastName }}
                    </div>
                </ng-template>
                <ng-template slot="dob" let-value="data"> {{ formatDate(value.dob) }} </ng-template>
                <ng-template slot="status" let-value="data">
                    <span class="badge" [ngClass]="'bg-' + value.statusColor">{{ value.status }}</span>
                </ng-template>
         
            </ng-datatable>
        </div> <div class="panel">
            <div class="mb-5 flex items-center justify-between">
                <h5 class="text-lg font-semibold dark:text-white">Number of Students per Supervisors</h5>
                <a class="font-semibold hover:text-gray-400 dark:text-gray-400 dark:hover:text-gray-600" href="javascript:;" 
                    >
                </a>
            </div>
    </div>     <div class="mb-5 overflow-hidden">
        <apx-chart
    [series]="pieChart.series"
    [chart]="pieChart.chart"
    [labels]="pieChart.labels"
    [colors]="pieChart.colors"
    [responsive]="pieChart.responsive"
    [stroke]="pieChart.stroke"
    [legend]="pieChart.legend"
    class="rounded-lg bg-white dark:bg-black"
></apx-chart>

    </div>
