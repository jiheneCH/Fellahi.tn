<div class="flex items-center justify-between gap-4 mb-6">
    <!-- Barre de recherche modernisée -->
    <div class="relative flex-grow max-w-xl">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input type="text"
              [(ngModel)]="searchReference" 
              (input)="searchReservationByReference()" 
             class="block w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
             placeholder="Search booking by reference">
    </div>
  
    
  
</div>
  
<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8 mt-8">
  <div *ngFor="let booking of bookings" 
       class="relative group overflow-hidden rounded-2xl bg-white dark:bg-gray-900 shadow-2xl hover:shadow-3xl transition-all duration-500 border border-gray-100 dark:border-gray-800 hover:border-emerald-300/30 dark:hover:border-emerald-400/20">
    
    <!-- Glow Effect -->
    <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
    
    <!-- Premium Badge -->
    <div class="absolute -right-8 -top-8 w-32 h-32 bg-emerald-500/10 rounded-full group-hover:bg-emerald-500/20 transition-all duration-700"></div>
    
    <!-- Card Content -->
    <div class="relative z-10 p-6">
      <!-- Event Title with Creative Underline -->
      <div class="mb-6">
        <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-2 inline-block relative">
          {{ booking.event?.title }}
          <span class="absolute bottom-0 left-0 w-full h-0.5 bg-gradient-to-r from-emerald-400 to-teal-300 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left"></span>
        </h3>
        <p class="text-emerald-500 font-mono text-sm">#{{ booking.reference }}</p>
      </div>
      
      <!-- Booking Details Grid -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <!-- Client -->
        <div class="space-y-1">
          <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Client</p>
          <div class="flex items-center">
            <div class="w-6 h-6 rounded-full bg-emerald-100 dark:bg-emerald-900/50 flex items-center justify-center mr-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-emerald-600 dark:text-emerald-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
              </svg>
            </div>
            <span class="font-medium text-gray-700 dark:text-gray-300">{{ booking.user?.username }}</span>
          </div>
        </div>
        
        <!-- Date -->
        <div class="space-y-1">
          <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Date</p>
          <div class="flex items-center">
            <div class="w-6 h-6 rounded-full bg-amber-100 dark:bg-amber-900/50 flex items-center justify-center mr-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-amber-600 dark:text-amber-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
              </svg>
            </div>
            <span class="font-medium text-gray-700 dark:text-gray-300">{{ booking.reservationDate | date: 'mediumDate' }}</span>
          </div>
        </div>
        
        <!-- Passengers -->
        <div class="space-y-1">
          <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Passengers</p>
          <div class="flex items-center">
            <div class="w-6 h-6 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center mr-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-blue-600 dark:text-blue-400" viewBox="0 0 20 20" fill="currentColor">
                <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v1h8v-1zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-1a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v1h-3zM4.75 12.094A5.973 5.973 0 004 15v1H1v-1a3 3 0 013.75-2.906z" />
              </svg>
            </div>
            <span class="font-medium text-gray-700 dark:text-gray-300">{{ booking.numberOfPass }} person</span>
          </div>
        </div>
        
        <!-- Price -->
        <div class="space-y-1">
          <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Total Price</p>
          <div class="flex items-center">
            <div class="w-6 h-6 rounded-full bg-purple-100 dark:bg-purple-900/50 flex items-center justify-center mr-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-purple-600 dark:text-purple-400" viewBox="0 0 20 20" fill="currentColor">
                <path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z" />
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.076-2.354-1.253V5z" clip-rule="evenodd" />
              </svg>
            </div>
            <span class="font-bold text-gray-900 dark:text-white">{{ booking.prixTotal }} DT</span>
          </div>
        </div>
      </div>
      
      <!-- Status Bar -->
      <div class="pt-4 border-t border-gray-100 dark:border-gray-800 flex justify-between items-center">
        <div class="flex items-center">
          <span class="relative flex h-3 w-3 mr-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
          </span>
          <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Confirmed</span>
        </div>
        
      </div>
    </div>
  </div>
</div>
