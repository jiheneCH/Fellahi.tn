<div class="container mt-2" style="max-width: 400px;">
    <h5 class="text-center mb-2">Order Stats</h5>
  
    <div class="d-flex justify-content-center">
      <apx-chart
        #chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [labels]="chartOptions.labels"
        [responsive]="chartOptions.responsive"
        [legend]="chartOptions.legend">
      </apx-chart>
    </div>
  
    <div class="mt-2 text-center small">
      <p>Total: {{ statistics.totalOrders }}</p>
      <p>Pending: {{ statistics.pendingPercentage }}%</p>
      <p>Cancelled: {{ statistics.cancelledPercentage }}%</p>
      <p>Confirmed: {{ statistics.confirmedPercentage }}%</p>
    </div>
  </div>
