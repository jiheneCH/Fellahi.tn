<div>
    <ul class="flex space-x-2 rtl:space-x-reverse">
        <li>
            <a href="javascript:;" class="text-primary hover:underline">Dashboard</a>
        </li>
        <li class="before:content-['/'] ltr:before:mr-2 rtl:before:ml-2">
            <span>Analytics</span>
        </li>
    </ul>
    <div class="pt-5">
        <div class="mb-6 grid grid-cols-1 gap-6 text-white sm:grid-cols-2 xl:grid-cols-4">
            <!-- Internship Applications -->
            <div class="panel bg-gradient-to-r from-green-500 to-green-400">
                <div class="flex justify-between">
                    <div class="text-md font-semibold">Applications Received</div>
                </div>
                <div class="mt-5 flex items-center">
                    <div class="text-3xl font-bold mr-2">320</div>
                    <div class="badge bg-white/30">+ 12%</div>
                </div>
                <div class="mt-5 flex items-center font-semibold">
                    <icon-eye class="ltr:mr-2 rtl:ml-2 shrink-0" />
                    Last Week 285
                </div>
            </div>
        
            <!-- Internships Approved -->
            <div class="panel bg-gradient-to-r from-violet-500 to-violet-400">
                <div class="flex justify-between">
                    <div class="text-md font-semibold">Internships Approved</div>
                </div>
                <div class="mt-5 flex items-center">
                    <div class="text-3xl font-bold mr-2">150</div>
                    <div class="badge bg-white/30"> + 5%</div>
                </div>
                <div class="mt-5 flex items-center font-semibold">
                    <icon-eye class="ltr:mr-2 rtl:ml-2 shrink-0" />
                    Last Week 143
                </div>
            </div>
        
            <!-- Active Internships -->
            <div class="panel bg-gradient-to-r from-blue-500 to-blue-400">
                <div class="flex justify-between">
                    <div class="text-md font-semibold">Active Internships</div>
                </div>
                <div class="mt-5 flex items-center">
                    <div class="text-3xl font-bold mr-2">80</div>
                    <div class="badge bg-white/30"> - 4%</div>
                </div>
                <div class="mt-5 flex items-center font-semibold">
                    <icon-eye class="ltr:mr-2 rtl:ml-2 shrink-0" />
                    Last Week 83
                </div>
            </div>
        
            <!-- Internship Completion Rate -->
            <div class="panel bg-gradient-to-r from-fuchsia-500 to-fuchsia-400">
                <div class="flex justify-between">
                    <div class="text-md font-semibold">Completion Rate</div>
                </div>
                <div class="mt-5 flex items-center">
                    <div class="text-3xl font-bold mr-2">95%</div>
                    <div class="badge bg-white/30"> + 2%</div>
                </div>
                <div class="mt-5 flex items-center font-semibold">
                    <icon-eye class="ltr:mr-2 rtl:ml-2 shrink-0" />
                    Last Week 93%
                </div>
            </div>
        </div>
        

        <div class="container mx-auto">
            <div class="grid grid-cols-2 gap-4">
                <div class="panel">
                    <div class="mb-5 flex items-center justify-between">
                        <h5 class="text-lg font-semibold dark:text-white">Basic Pie</h5>
                        <a class="font-semibold hover:text-gray-400 dark:text-gray-400 dark:hover:text-gray-600" href="javascript:;" (click)="toggleCode('code8')"
                            >
                        </a>
                    </div>
                    <div class="mb-5 overflow-hidden">
                        <apx-chart
                            [series]="pieChart.series"
                            [chart]="pieChart.chart"
                            [labels]="pieChart.labels"
                            [colors]="pieChart.colors"
                            [responsive]="pieChart.responsive"
                            [stroke]="pieChart.stroke"
                            [legend]="pieChart.legend"
                            class="rounded-lg bg-white dark:bg-black"
                        ></apx-chart>
                    </div>
                    
                  
                </div>
                <div class="panel">
                    <div class="mb-5 flex items-center justify-between">
                        <h5 class="text-lg font-semibold dark:text-white-light">Simple Line</h5>
                        <a class="font-semibold hover:text-gray-400 dark:text-gray-400 dark:hover:text-gray-600" href="javascript:;" (click)="toggleCode('code1')"
                            >
                        </a>
                    </div>
                    <div class="mb-5 overflow-hidden">
                        <apx-chart
                            [series]="lineChart.series"
                            [chart]="lineChart.chart"
                            [colors]="lineChart.colors"
                            [tooltip]="lineChart.tooltip"
                            [stroke]="lineChart.stroke"
                            [xaxis]="lineChart.xaxis"
                            [yaxis]="lineChart.yaxis"
                            [grid]="lineChart.grid"
                            class="rounded-lg bg-white dark:bg-black"
                        ></apx-chart>
                    </div>
                </div>
             
            </div>
          </div>
          
            
        
    </div>
</div>
