
<div class="flex flex-wrap gap-4 mb-4 items-end">
  <!-- Liste déroulante des statuts -->
  <div>
    <label class="block text-sm font-medium mb-1">Status</label>
    <select [(ngModel)]="selectedStatut" 
            (change)="appliquerFiltres()"
            class="p-2 border rounded-md shadow-sm w-full">
      <option *ngFor="let statut of statuts" [value]="statut">
        {{ statut === 'TOUS' ? 'Toutes les livraisons' : statut }}
      </option>
    </select>
  </div>

  <!-- Calendrier - Date de début -->
  <div>
    <label class="block text-sm font-medium mb-1">From</label>
    <input type="date" 
           [(ngModel)]="dateRange.start"
           (change)="appliquerFiltres()"
           class="p-2 border rounded-md shadow-sm">
  </div>

  <!-- Calendrier - Date de fin -->
  <div>
    <label class="block text-sm font-medium mb-1">To</label>
    <input type="date" 
           [(ngModel)]="dateRange.end"
           (change)="appliquerFiltres()"
           class="p-2 border rounded-md shadow-sm">
  </div>
  <div class="flex items-center gap-2 min-w-[300px]">
    <input type="text" placeholder="Rechercher par nom ou téléphone"
    [(ngModel)]="searchText"
    class="form-control my-2" />

<button
(click)="rechercherParNomOuTelephone()"
class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
>
Search
</button>
  
    <button
      (click)="rafraichirDonnees()"
      class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
    >
      Refresh
    </button>
  </div>
  
  

</div>
<table>
  <thead>
    <tr>
      <th>id</th>
      <th>Client Name</th>
      <th>Client Adress</th>
      <th>Delivery Date</th>
      <th>Total Price</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let livraison of paginatedLivraisons">
      
      <td>{{ livraison.id }}</td>
      <td>{{ livraison.prenomClient }}</td>
      <td>{{ livraison.adresseClient }}</td>
      <td>{{ livraison.dateLivraison | date: 'dd/MM/yyyy' }}</td>
      <td>{{ livraison.prixTotal }} TND</td>
      <td><div [class]="'inline-block px-3 py-1 rounded-full text-sm font-semibold ' + 
        (livraison.statut === 'ANNULE' ? 'bg-red-100 text-red-800' : 
        livraison.statut === 'LIVRE' ? 'bg-green-100 text-green-800' : 
         livraison.statut === 'RETARDE' ? 'bg-orange-100 text-orange-800' :
         livraison.statut === 'EN_ATTENTE' ? 'bg-yellow-100 text-yellow-800' :
         'bg-blue-100 text-blue-800')">
{{ livraison.statut }}
</div></td>

<td class="px-6 py-4 whitespace-nowrap">
  <div class="flex items-center space-x-2"> 
   
    <button class="btn btn-outline-primary p-2 rounded-md hover:bg-blue-50 transition-colors" 
    [routerLink]="['/transporteur', transporteurId, 'deliveries', 'details', livraison.id]"
            title="Voir détails">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
      </svg>
    </button>

    <button [disabled]="livraison.statut === 'ANNULE' || livraison.statut === 'LIVRE'"
            class="btn btn-outline-success p-2 rounded-md hover:bg-green-50 transition-colors"
            (click)="marquerLivre(livraison.id)"
            title="Marquer comme livré">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check" viewBox="0 0 16 16">
              <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425z"/>
            </svg>
    </button>
    
      <button 
      [routerLink]="['/transporteur', transporteurId,'deliveries','show-location', livraison.adresseClient, livraison.delClient]"
      class="btn btn-outline-danger p-2 rounded-md hover:bg-red-50 transition-colors"
      [disabled]="livraison.statut === 'LIVRE' || livraison.statut === 'ANNULE'"
      title="Voir sur Google Maps">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt" viewBox="0 0 16 16">
        <path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A32 32 0 0 1 8 14.58a32 32 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10"/>
        <path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
      </svg>
    </button>
    
     <!-- Bouton Modifier - Conditionné par estModifiable() -->
  <button   
  [disabled]="!estModifiable(livraison.statut)"
  [class.opacity-50]="!estModifiable(livraison.statut)"
  [class.cursor-not-allowed]="!estModifiable(livraison.statut)"
  class="btn btn-outline-secondary p-2 rounded-md hover:bg-gray-50 transition-colors"
  [routerLink]="['/transporteur', transporteurId, 'deliveries', 'modifier', livraison.id]"
  title="{{ estModifiable(livraison.statut) ? 'Modifier le statut' : 'Modification non autorisée' }}">
<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
<path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
</svg>
</button>

<button 
[routerLink]="['/transporteur', transporteurId, 'deliveries', 'reclamationTransporteur', livraison.id]"
class="btn btn-outline-danger p-2 rounded-md hover:bg-red-50 transition-colors"
[disabled]="livraison.statut === 'LIVRE' "
title="Réclamer">
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
  <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
  <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
</svg>
</button>
    </div>
 
</td>
    </tr>
   
    
  </tbody>
  
</table>
<!-- Pagination -->
<div class="flex justify-center items-center gap-2 mt-4">
  <button (click)="page = page - 1" [disabled]="page === 1"
          class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-50">
    Précédent
  </button>

  <span *ngFor="let p of [].constructor(totalPages); let i = index"
        (click)="page = i + 1"
        class="px-3 py-1 rounded cursor-pointer"
        [ngClass]="{
          'bg-blue-500 text-white': page === i + 1,
          'bg-gray-200': page !== i + 1
        }">
    {{ i + 1 }}
  </span>

  <button (click)="page = page + 1" [disabled]="page === totalPages"
          class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-50">
    Suivant
  </button>
</div>
