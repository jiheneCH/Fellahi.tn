<div class="flex items-center justify-between gap-4 mb-6">
  <!-- Barre de recherche modernisée -->
  <div class="relative flex-grow max-w-xl">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
    <input type="text"
           [(ngModel)]="searchReference" 
           (input)="searchEventByReference()" 
           class="block w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
           placeholder="Search event by reference">
  </div>

  

  <!-- Bouton Add Event modernisé -->
  <button class="flex items-center space-x-2 px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg shadow hover:shadow-md hover:from-blue-600 hover:to-blue-700 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-50"
          [routerLink]="['/admin/event-add']"
          title="Ajouter un événement">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
      <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
      <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
    </svg>
    <span>Add Event</span>
  </button>
</div>



<table class="table mt-4">
  <thead>
    <tr>
      <th scope="col">Reference</th>
      <th scope="col">Title</th>
      <th scope="col">Description</th>
      <th scope="col">Date</th>
      <th scope="col">Time</th>
      <th scope="col">Location</th>
      <th scope="col">Seats</th>
      <th scope="col">Status</th>
      <th scope="col">Image</th>
      <th scope="col">PDF file</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody> 
    <tr *ngFor="let event of events">
      <td>{{ event.reference }}</td>
      <td>{{ event.title }}</td>
      <td>{{ event.description }}</td>
      <td>{{ event.dateEvent }}</td>
      <td>{{ event.heureEvent }}</td>
      <td>{{ event.location }}</td>
      <td>{{ event.nombrePlaces }}</td>
      
      <!-- Affichage dynamique du statut avec couleur -->
      <td [ngClass]="{
        'text-green-600': event.status === 'complete',
        'text-yellow-600': event.status === 'disponible',
        'text-red-500': event.status === 'archive'
      }">
        {{ event.status }}
      </td>
      
      <td>{{ event.image }}</td>
      <td>{{ event.pdf }}</td>
      
      <td>
        <div class="flex space-x-2">
            <!-- Bouton Modifier - Désactivé si archivé -->
            <button class="btn btn-outline-primary p-2 rounded-md hover:bg-blue-50 transition-colors"
                    [routerLink]="['/admin/event-edit', event.idEvent]"
                    [disabled]="event.status === 'archive'"
                    title="{{ event.status === 'archive' ? 'Modification désactivée (événement archivé)' : 'Modifier l\'événement' }}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil" viewBox="0 0 16 16">
                    <path d="M12.146 0.854a2 2 0 0 1 2.828 2.828L5.707 11.293a1 1 0 0 1-.38.213l-4 1a1 1 0 0 1-1.21-1.21l1-4a1 1 0 0 1 .213-.38L10.707 2.022a2 2 0 0 1 2.828-.168z"/>
                </svg>
            </button>
            
            <!-- Bouton Archiver - Désactivé si archivé -->
            <button class="btn btn-outline-danger p-2 rounded-md hover:bg-red-50 transition-colors"
                    [disabled]="event.status === 'archive'"
                    (click)="archiverEvent(event.idEvent)"
                    title="{{ event.status === 'archive' ? 'Événement déjà archivé' : 'Archiver l\'événement' }}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-archive" viewBox="0 0 16 16">
                    <path d="M4 2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1H4zm0 1h8v9H4V3zm1 4h6v1H5V7z"/>
                </svg>
            </button>


            <div class="flex space-x-2">
              <button class="btn btn-outline-primary p-2 rounded-md hover:bg-blue-50 transition-colors"
                      [routerLink]="['/admin/event-view', event.idEvent]"
                      title="Toggle visibility">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                      <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                      <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                  </svg>
              </button>
          </div>
        </div>
    </td>
    </tr>
  </tbody>
</table>
