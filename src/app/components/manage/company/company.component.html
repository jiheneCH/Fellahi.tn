<div>
    <div class="flex flex-wrap items-center justify-between gap-4">
        <h2 class="text-xl">Companies</h2>
        <div class="flex w-full flex-col gap-4 sm:w-auto sm:flex-row sm:items-center sm:gap-3">
            <div class="flex gap-3">
                <div>
                    <button type="button" class="btn btn-primary" (click)="editCompany(null)">
                        <icon-user-plus class="ltr:mr-2 rtl:ml-2" />
                        Add Company
                    </button>
                </div>
                <div>
                    <button
                        type="button"
                        class="btn btn-outline-primary p-2"
                        [ngClass]="{ 'bg-primary text-white': displayType === 'list' }"
                        (click)="displayType = 'list'"
                    >
                        <icon-list-check />
                    </button>
                </div>
                <div>
                    <button
                        type="button"
                        class="btn btn-outline-primary p-2"
                        [ngClass]="{ 'bg-primary text-white': displayType === 'grid' }"
                        (click)="displayType = 'grid'"
                    >
                        <icon-layout-grid />
                    </button>
                </div>
            </div>

            <div class="relative">
                <input
                    type="text"
                    placeholder="Search Companies"
                    class="peer form-input py-2 ltr:pr-11 rtl:pl-11"
                    [(ngModel)]="searchQuery"
                    (ngModelChange)="searchCompanies()"
                />
                <icon-search class="absolute top-1/2 -translate-y-1/2 peer-focus:text-primary ltr:right-[11px] rtl:left-[11px]" />
            </div>
        </div>
    </div>
    <div class="panel mt-5 overflow-hidden border-0 p-0">
        <ng-container *ngIf="displayType === 'list'">
            <div class="table-responsive">
                <table class="table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th class="!text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let company of filteredCompanies">
                            <td>{{ company.name }}</td>
                            <td>{{ company.email }}</td>
                            <td>{{ company.phone }}</td>
                            <td>{{ company.address }}</td>
                            <td>
                                <div class="flex items-center justify-center gap-4">
                                    <button type="button" class="btn btn-sm btn-outline-primary" (click)="editCompany(company)">Edit</button>
                                    <button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteCompany(company.id)">Delete</button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </ng-container>

        <ng-container *ngIf="displayType === 'grid'">
            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">
                <div *ngFor="let company of filteredCompanies" class="overflow-hidden rounded-md bg-white text-center shadow dark:bg-[#1c232f]">
                    <!-- Adjusted to use a placeholder image for companies -->
                    <div class="rounded-t-md bg-white/40 p-6 pb-0">
                        <img src="/assets/images/company-placeholder.png" class="mx-auto max-h-40 w-4/5 object-contain" alt="Company Image">
                    </div>
                    <div class="px-6 py-4">
                        <div class="text-xl font-medium">{{ company.name }}</div>
                        <div class="mt-2 text-gray-600">{{ company.email }}</div>
                        <div class="mt-2 text-gray-600">{{ company.phone }}</div>
                        <div class="mt-2 text-gray-600">{{ company.address }}</div>
                        <div class="mt-4 flex justify-center gap-4">
                            <button type="button" class="btn btn-outline-primary" (click)="editCompany(company)">Edit</button>
                            <button type="button" class="btn btn-outline-danger" (click)="deleteCompany(company.id)">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
    </div>
    
    <!-- add contact modal -->
    <modal #companyModal class="no-footer">
        <ng-template #modalHeader>
            <div class="!font-medium">{{ companyForm.controls['id'].value ? 'Edit Contact' : 'Add Contact' }}</div>
        </ng-template>
        <ng-template #modalBody>
            <form [formGroup]="companyForm" class="text-sm" (ngSubmit)="saveCompany()" ngNativeValidate>
                <div class="mb-5">
                    <label for="name">Name</label>
                    <input id="name" type="text" placeholder="Enter Name" class="form-input" formControlName="name" />
                </div>
                <div class="mb-5">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="Enter Email" class="form-input" formControlName="email" />
                </div>
                <div class="mb-5">
                    <label for="number">Phone Number</label>
                    <input id="number" type="text" placeholder="Enter Phone Number" class="form-input" formControlName="phone" />
                </div>
                <div class="mb-5">
                    <label for="occupation">ID COMPANY</label>
                    <input id="occupation" type="text" readonly class="form-input bg-neutral-100" formControlName="idCompany" />
                </div>
                <div class="mb-5">
                    <label for="occupation">Address</label>
                    <input id="occupation" type="text" placeholder="Enter Occupation" class="form-input" formControlName="address" />
                </div>
                <div class="mt-8 flex items-center justify-end">
                    <button type="button" class="btn btn-outline-danger" (click)="companyModal.close()">Cancel</button>
                    <button type="submit" class="btn btn-primary ltr:ml-4 rtl:mr-4">{{ companyForm.controls['id'].value ? 'Update' : 'Add' }}</button>
                </div>
            </form>
        </ng-template>
    </modal>
</div>
