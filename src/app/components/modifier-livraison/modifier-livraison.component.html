<div class="mt-6 flex justify-end space-x-3">
    <button class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 transition" routerLink="/transporteur/deliveries">
      Retour à la liste
    </button>
   
  </div>
<div class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
  <h2 class="text-xl font-bold mb-6">Modifier Livraison #{{idLivraison}}</h2>

  <div class="mb-4">
    <label class="block text-gray-700 mb-2">Statut:</label>
    <select [(ngModel)]="selectedStatut" 
            (change)="onStatutChange(selectedStatut)"
            class="w-full p-2 border rounded">
      <option *ngFor="let statut of statuts" [value]="statut">
        {{ statut }}
      </option>
    </select>
  </div>

  <div *ngIf="showDatePicker" class="mb-4">
    <label class="block text-gray-700 mb-2">Nouvelle date de livraison:</label>
    <input type="date" 
           [(ngModel)]="nouvelleDateRetard"
           [min]="minDate"
           class="w-full p-2 border rounded">
  </div>

  <div class="flex justify-end space-x-4">
    <button (click)="annuler()" 
            class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
      Annuler
    </button>
    <button (click)="sauvegarderModification()" 
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
      Enregistrer
    </button>
  </div>
</div>
