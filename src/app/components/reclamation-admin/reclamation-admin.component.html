<div class="reclamation-admin-wrapper">
  <mat-card>
    <div class="card-header">
      <h2>Reclamations Overview</h2>
      <div class="button-group">

        <!-- Add this inside .button-group -->
<button mat-raised-button color="accent" (click)="toggleDateFilter()" class="date-filter-btn">
  <mat-icon>calendar_today</mat-icon>
  {{ showLatest ? 'Latest First' : 'Oldest First' }}
</button>

        <button mat-raised-button color="primary" class="refresh-btn" (click)="loadReclamations()">
          <mat-icon>refresh</mat-icon>
          Refresh
        </button>
        
        <div class="filter-group">
          <select id="statusSelect" [(ngModel)]="selectedStatus" (change)="onFilterByStatus()" class="role-select">
            <option value="">🌐 All Statuses</option>
            <option value="PENDING">⏳ Pending</option>
            <option value="IN_PROGRESS">🔧 In Progress</option>
            <option value="RESOLVED">✅ Resolved</option>
          </select>
        </div>
      </div>
    </div>

    <table mat-table [dataSource]="reclamations" class="mat-elevation-z2 hover-table" *ngIf="reclamations?.length">
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let r"> {{ r.id }} </td>
      </ng-container>

      <!-- User ID -->
      <ng-container matColumnDef="userId">
        <th mat-header-cell *matHeaderCellDef> User ID </th>
        <td mat-cell *matCellDef="let r"> {{ r.userId }} </td>
      </ng-container>

      <!-- Username -->
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef> User </th>
        <td mat-cell *matCellDef="let r"> {{ r.username }} </td>
      </ng-container>

      <!-- Subject -->
      <ng-container matColumnDef="subject">
        <th mat-header-cell *matHeaderCellDef> Subject </th>
        <td mat-cell *matCellDef="let r"> {{ r.subject }} </td>
      </ng-container>

      <!-- Description -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description </th>
        <td mat-cell *matCellDef="let r"> {{ r.description }} </td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let r">
          <span [ngClass]="getStatusClass(r.status)" class="status-badge">
            {{ r.status }}
          </span>
        </td>
      </ng-container>

      <!-- Created Date -->
      <ng-container matColumnDef="createdDate">
        <th mat-header-cell *matHeaderCellDef> Date </th>
        <td mat-cell *matCellDef="let r"> {{ r.createdDate | date:'medium' }} </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button color="accent" (click)="openResponseDialog(r)">
            <mat-icon>reply</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="markAsResolved(r)">
            <mat-icon>check_circle</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
    </table>

    <div class="no-data" *ngIf="reclamations?.length === 0">
      <p>No reclamations found.</p>
    </div>
  </mat-card>
</div>
