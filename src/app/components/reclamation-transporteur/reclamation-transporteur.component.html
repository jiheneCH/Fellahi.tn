<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow-md mt-8 dark:bg-gray-800">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-6 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      Signaler un incident pour la livraison n°{{ livraisonId }}
    </h2>
  
    <div *ngIf="message"
      class="p-4 mb-6 rounded-lg bg-blue-50 text-blue-800 dark:bg-blue-900 dark:text-blue-200 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2h-1V9z"
          clip-rule="evenodd" />
      </svg>
      {{ message }}
    </div>
  
    <form (ngSubmit)="signalerIncident()" class="space-y-6">
      <!-- CHAMP TYPE INCIDENT REMPLACÉ -->
      <div class="space-y-2">
        <label for="typeIncident" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Type d'incident <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          id="typeIncident"
          [(ngModel)]="typeIncident"
          name="typeIncident"
          placeholder="Ex : Retard, produit endommagé..."
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          required
        />
      </div>
  
      <div class="space-y-2">
        <label for="descriptionIncident" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Description détaillée <span class="text-red-500">*</span>
        </label>
        <textarea id="descriptionIncident" [(ngModel)]="descriptionIncident" name="descriptionIncident"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          rows="5" placeholder="Décrivez l'incident en détail..." required></textarea>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Merci de fournir le maximum de détails pour nous aider à résoudre le problème.</p>
      </div>
  
      <div class="flex justify-end space-x-4">
        <button (click)="annuler()" 
            class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
      Annuler
    </button>
        <button type="submit"
          class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd" />
          </svg>
          Signaler l'incident
        </button>
      </div>
    </form>
  </div>
