  <!-- CSS Styles -->
  <style>
  :root {
    --primary-green: #2ecc71;
    --primary-orange: #f39c12;
    --dark-green: #27ae60;
    --dark-orange: #e67e22;
    --black: #2c3e50;
    --white: #f5f5f5;
    --light-gray: #ecf0f1;
    --text-color: #333;
    --sidebar-width: 260px;
  }
  
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  
  .sidebar {
    width: var(--sidebar-width);
    height: 100vh;
    background: var(--white);
    border-right: 1px solid var(--light-gray);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
    overflow-y: auto;
    transition: all 0.3s ease;
    position: fixed;
    left: 0;
    top: 0;
  }
  
  .logo-container {
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--light-gray);
  }
  
  .logo {
    background: linear-gradient(135deg, var(--primary-green), var(--primary-orange));
    height: 50px;
    width: 50px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-weight: bold;
    font-size: 16px;
    position: relative;
    overflow: hidden;
  }
  
  .logo::before {
    content: '';
    position: absolute;
    width: 150%;
    height: 150%;
    background: rgba(255, 255, 255, 0.1);
    transform: rotate(45deg);
    top: -25%;
    left: -100%;
    transition: all 0.3s ease;
  }
  
  .logo:hover::before {
    left: 100%;
  }
  
  .menu-section {
    padding: 10px 15px;
    margin-top: 5px;
  }
  
  .section-title {
    color: var(--black);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    padding-left: 10px;
    opacity: 0.6;
    font-weight: 600;
  }
  
  .menu-items {
    list-style-type: none;
    padding: 0;
    margin: 0;
  }
  
  .menu-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    margin: 5px 0;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: var(--text-color);
    position: relative;
    overflow: hidden;
  }
  
  .menu-item::before {
    content: '';
    position: absolute;
    left: -5px;
    height: 100%;
    width: 5px;
    background: linear-gradient(to bottom, var(--primary-green), var(--primary-orange));
    transition: all 0.3s ease;
  }
  
  .menu-item:hover {
    background-color: var(--light-gray);
  }
  
  .menu-item:hover::before {
    left: 0;
  }
  
  .menu-item.active {
    background: linear-gradient(to right, rgba(46, 204, 113, 0.1), rgba(243, 156, 18, 0.1));
    color: var(--primary-green);
  }
  
  .menu-item.active::before {
    left: 0;
  }
  
  .item-icon {
    margin-right: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .menu-item:hover .item-icon, 
  .menu-item.active .item-icon {
    color: var(--primary-green);
  }
  
  .menu-item svg {
    stroke-width: 1.5;
  }
  
  .user-profile {
    margin-top: auto;
    padding: 15px;
    border-top: 1px solid var(--light-gray);
    display: flex;
    align-items: center;
  }
  
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-green), var(--primary-orange));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-weight: bold;
    margin-right: 10px;
  }
  
  .user-info {
    flex: 1;
  }
  
  .user-name {
    margin: 0;
    font-weight: 600;
    font-size: 14px;
    color: var(--black);
  }
  
  .user-role {
    margin: 0;
    font-size: 12px;
    color: var(--text-color);
    opacity: 0.7;
  }
  
  /* Animation for menu items on hover */
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  
  .menu-item:hover span {
    animation: pulse 0.5s;
  }
  
  /* Responsive adjustments */
  @media screen and (max-width: 992px) {
    .sidebar {
      width: 80px;
      overflow: visible;
    }
    
    .sidebar:hover {
      width: var(--sidebar-width);
    }
    
    .menu-item span,
    .section-title,
    .user-info {
      display: none;
    }
    
    .sidebar:hover .menu-item span,
    .sidebar:hover .section-title,
    .sidebar:hover .user-info {
      display: block;
    }
    
    .sidebar:hover .logo {
      width: 50px;
    }
  }
  </style>
